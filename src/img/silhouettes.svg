<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 340" width="1020" height="340" role="img" aria-labelledby="t">
<title id="t">Six wedding dress silhouettes compared: A-line, ball gown, mermaid, trumpet, sheath and empire. Dashed line marks where the skirt starts to flare.</title>
<rect width="1020" height="340" fill="#faf7f2"/>
<style>text{font-family:Inter,Heebo,Arial,sans-serif;font-size:16px;fill:#2b2622}.s{font-size:12px;fill:#675e57}</style>
<g transform="translate(0,0)">
<circle cx="85" cy="24" r="11" fill="#e6ddd2" stroke="#8d5a44" stroke-width="1.5"/>
<path d="M39,40 C45,70 59,98 63,118 L25,292 L145,292 L107,118 C111,98 125,70 131,40 Z" fill="#efe6dc" stroke="#8d5a44" stroke-width="2" stroke-linejoin="round"/>
<line x1="18" y1="118" x2="152" y2="118" stroke="#8d5a44" stroke-width="1" stroke-dasharray="4 4" opacity=".7"/>
<text x="85" y="316" text-anchor="middle">A-line</text><text x="85" y="333" text-anchor="middle" class="s">flares from the waist</text>
</g>
<g transform="translate(170,0)">
<circle cx="85" cy="24" r="11" fill="#e6ddd2" stroke="#8d5a44" stroke-width="1.5"/>
<path d="M39,40 C45,70 59,98 63,118 C15,170 5,240 7,292 L163,292 C165,240 155,170 107,118 C111,98 125,70 131,40 Z" fill="#efe6dc" stroke="#8d5a44" stroke-width="2" stroke-linejoin="round"/>
<line x1="18" y1="118" x2="152" y2="118" stroke="#8d5a44" stroke-width="1" stroke-dasharray="4 4" opacity=".7"/>
<text x="85" y="316" text-anchor="middle">Ball gown</text><text x="85" y="333" text-anchor="middle" class="s">full skirt from the waist</text>
</g>
<g transform="translate(340,0)">
<circle cx="85" cy="24" r="11" fill="#e6ddd2" stroke="#8d5a44" stroke-width="1.5"/>
<path d="M39,40 C45,70 59,98 63,118 C55,160 57,200 61,232 C45,262 23,278 19,292 L151,292 C147,278 125,262 109,232 C113,200 115,160 107,118 C111,98 125,70 131,40 Z" fill="#efe6dc" stroke="#8d5a44" stroke-width="2" stroke-linejoin="round"/>
<line x1="18" y1="232" x2="152" y2="232" stroke="#8d5a44" stroke-width="1" stroke-dasharray="4 4" opacity=".7"/>
<text x="85" y="316" text-anchor="middle">Mermaid</text><text x="85" y="333" text-anchor="middle" class="s">flares at the knee</text>
</g>
<g transform="translate(510,0)">
<circle cx="85" cy="24" r="11" fill="#e6ddd2" stroke="#8d5a44" stroke-width="1.5"/>
<path d="M39,40 C45,70 59,98 63,118 C55,150 55,175 57,190 C45,230 29,265 25,292 L145,292 C141,265 125,230 113,190 C115,175 115,150 107,118 C111,98 125,70 131,40 Z" fill="#efe6dc" stroke="#8d5a44" stroke-width="2" stroke-linejoin="round"/>
<line x1="18" y1="190" x2="152" y2="190" stroke="#8d5a44" stroke-width="1" stroke-dasharray="4 4" opacity=".7"/>
<text x="85" y="316" text-anchor="middle">Trumpet</text><text x="85" y="333" text-anchor="middle" class="s">flares at mid-thigh</text>
</g>
<g transform="translate(680,0)">
<circle cx="85" cy="24" r="11" fill="#e6ddd2" stroke="#8d5a44" stroke-width="1.5"/>
<path d="M39,40 C45,70 59,98 63,118 C55,160 55,240 55,292 L115,292 C115,240 115,160 107,118 C111,98 125,70 131,40 Z" fill="#efe6dc" stroke="#8d5a44" stroke-width="2" stroke-linejoin="round"/>
<text x="85" y="316" text-anchor="middle">Sheath</text><text x="85" y="333" text-anchor="middle" class="s">no flare</text>
</g>
<g transform="translate(850,0)">
<circle cx="85" cy="24" r="11" fill="#e6ddd2" stroke="#8d5a44" stroke-width="1.5"/>
<path d="M39,40 C45,58 55,72 59,82 C49,150 37,230 35,292 L135,292 C133,230 121,150 111,82 C115,72 125,58 131,40 Z" fill="#efe6dc" stroke="#8d5a44" stroke-width="2" stroke-linejoin="round"/>
<line x1="18" y1="82" x2="152" y2="82" stroke="#8d5a44" stroke-width="1" stroke-dasharray="4 4" opacity=".7"/>
<text x="85" y="316" text-anchor="middle">Empire</text><text x="85" y="333" text-anchor="middle" class="s">waist under the bust</text>
</g>
</svg>