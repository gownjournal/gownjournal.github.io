<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 770" width="520" height="770" role="img" aria-labelledby="t">
<title id="t">Veil lengths on a figure: birdcage, shoulder, elbow, fingertip, chapel and cathedral.</title>
<rect width="520" height="770" fill="#faf7f2"/>
<style>text{font-family:Inter,Heebo,Arial,sans-serif;font-size:15px;fill:#2b2622}.s{font-size:12px;fill:#675e57}</style>
<circle cx="150" cy="60" r="22" fill="#e6ddd2" stroke="#8d5a44" stroke-width="1.5"/>
<path d="M98,110 C104,150 122,200 126,220 C110,330 80,520 74,690 L226,690 C220,520 190,330 174,220 C178,200 196,150 202,110 Z" fill="#efe6dc" stroke="#8d5a44" stroke-width="2"/>
<path d="M124,70 L20,690 L280,690 L176,70 Z" fill="#8d5a44" opacity=".07"/>
<line x1="20" y1="110" x2="280" y2="110" stroke="#8d5a44" stroke-width="1" stroke-dasharray="4 4"/>
<text x="300" y="106" text-anchor="start">Birdcage</text><text x="300" y="123" text-anchor="start" class="s">to the cheekbones</text>
<line x1="20" y1="150" x2="280" y2="150" stroke="#8d5a44" stroke-width="1" stroke-dasharray="4 4"/>
<text x="300" y="146" text-anchor="start">Shoulder</text><text x="300" y="163" text-anchor="start" class="s">around 50 cm</text>
<line x1="20" y1="300" x2="280" y2="300" stroke="#8d5a44" stroke-width="1" stroke-dasharray="4 4"/>
<text x="300" y="296" text-anchor="start">Elbow</text><text x="300" y="313" text-anchor="start" class="s">around 80 cm</text>
<line x1="20" y1="420" x2="280" y2="420" stroke="#8d5a44" stroke-width="1" stroke-dasharray="4 4"/>
<text x="300" y="416" text-anchor="start">Fingertip</text><text x="300" y="433" text-anchor="start" class="s">around 110 cm</text>
<line x1="20" y1="690" x2="280" y2="690" stroke="#8d5a44" stroke-width="1" stroke-dasharray="4 4"/>
<text x="300" y="668" text-anchor="start">Chapel</text><text x="300" y="685" text-anchor="start" class="s">to the end of the train</text>
<line x1="20" y1="740" x2="280" y2="740" stroke="#8d5a44" stroke-width="1" stroke-dasharray="4 4"/>
<text x="300" y="736" text-anchor="start">Cathedral</text><text x="300" y="753" text-anchor="start" class="s">past the train</text>
</svg>